<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lecture Submissions</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Heading and navigation -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="h3 mb-1">
                Submissions
            </h1>

            <p class="text-muted mb-0">
                Review and grade lecture submissions.
            </p>
        </div>

        <a class="btn btn-outline-secondary"
           th:href="@{|/courses/${courseId}/lectures/${lectureId}|}">
            &larr; Back to Lecture
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${msg}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${msg}">
            Success
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${error}">
            Error
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <!-- No submissions -->
    <div th:if="${#lists.isEmpty(submissions)}"
         class="alert alert-info">

        No submissions have been made for this lecture.
    </div>

    <!-- Submissions table -->
    <div th:if="${!#lists.isEmpty(submissions)}"
         class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                            Student
                        </th>

                        <th>Submitted</th>
                        <th>File</th>
                        <th>Status</th>
                        <th>Student Comment</th>

                        <th sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                            Grade / Teacher Note
                        </th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="sub : ${submissions}">

                        <td sec:authorize="hasAnyRole('TEACHER', 'ADMIN')"
                            th:text="${sub.student.email}">
                            student@example.com
                        </td>

                        <td th:text="${#temporals.format(
                                        sub.submittedAt,
                                        'yyyy-MM-dd HH:mm')}">
                            —
                        </td>

                        <td>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{|/courses/${courseId}/lectures/${lectureId}/assignments/${sub.assignmentId}/download|}">
                                Download
                            </a>
                        </td>

                        <td>
                            <span th:if="${sub.grade == null}"
                                  class="badge text-bg-warning">
                                Pending
                            </span>

                            <span th:if="${sub.grade != null}"
                                  class="badge text-bg-success"
                                  th:text="${'Grade: ' + sub.grade}">
                                Grade
                            </span>
                        </td>

                        <td th:text="${sub.studentComment != null
                                     and !sub.studentComment.isBlank()
                                     ? sub.studentComment
                                     : '—'}">
                            —
                        </td>

                        <td sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">

                            <form th:action="@{|/courses/${courseId}/lectures/${lectureId}/assignments/${sub.assignmentId}/grade|}"
                                  method="post"
                                  class="d-flex flex-column gap-2">

                                <input type="number"
                                       name="grade"
                                       class="form-control form-control-sm"
                                       th:value="${sub.grade}"
                                       min="0"
                                       max="100"
                                       step="0.1"
                                       placeholder="Grade"
                                       required>

                                <input type="text"
                                       name="teacherComment"
                                       class="form-control form-control-sm"
                                       th:value="${sub.teacherComment}"
                                       maxlength="500"
                                       placeholder="Teacher note">

                                <button type="submit"
                                        class="btn btn-sm btn-primary align-self-start">
                                    Save Grade
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a class="btn btn-secondary"
           th:href="@{|/courses/${courseId}/lectures/${lectureId}|}">
            &larr; Back to Lecture
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
