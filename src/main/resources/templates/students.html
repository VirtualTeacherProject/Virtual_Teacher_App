<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/home}">Virtual Teacher</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/courses}">Courses</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <h1 class="h3 mb-3">Students</h1>

    <!-- Search (SCRUM-6) -->
    <form th:action="@{/students}" method="get" class="row g-2 mb-4">
        <div class="col-md-8 col-lg-6">
            <input type="text"
                   name="q"
                   class="form-control"
                   th:value="${q}"
                   maxlength="254"
                   placeholder="Search students by first name, last name or email">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </div>
        <div class="col-auto" th:if="${q != null and !q.isEmpty()}">
            <a th:href="@{/students}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(students)}">
        No students found.
    </div>

    <div class="card shadow-sm" th:if="${!#lists.isEmpty(students)}">
        <div class="card-body">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Enrolled courses</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.firstName + ' ' + s.lastName}">Name</td>
                    <td th:text="${s.email}">email@example.com</td>
                    <td>
                        <span class="text-muted" th:if="${#sets.isEmpty(s.courses)}">None</span>
                        <a th:each="c : ${s.courses}"
                           th:href="@{/courses/{id}(id=${c.courseId})}"
                           th:text="${c.title}"
                           class="badge bg-secondary text-decoration-none me-1">Course</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
